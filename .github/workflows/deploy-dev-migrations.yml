name: Deploy dev migrations

on:
  push:
    branches: [dev]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link to dev project
        run: supabase link --project-ref tvfdlyecmdmzqjbdgwtq

      - name: Show pending migrations (dry run)
        run: supabase db push --linked --dry-run

      - name: Push pending migrations to dev
        run: supabase db push --linked --yes

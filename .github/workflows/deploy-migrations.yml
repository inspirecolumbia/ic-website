name: Deploy prod migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link to prod project
        run: supabase link --project-ref miirjrgbgejzhnfdfegk

      - name: Show pending migrations (dry run)
        run: supabase db push --linked --dry-run

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link to prod project
        run: supabase link --project-ref miirjrgbgejzhnfdfegk

      - name: Push pending migrations to prod
        run: supabase db push --linked --yes

name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run test:unit

  # main only ever receives promotions from dev -- never a direct feature or
  # hotfix branch. Required as a status check on the "Protect main" ruleset
  # so this is enforced by CI, not by someone remembering the rule. See
  # CONTRIBUTING.md's "How to contribute code" section.
  main-only-from-dev:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify this PR is a promotion from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs into main must come from dev -- branch directly off dev instead of main, even for an urgent fix, then promote from there." >&2
            exit 1
          fi
